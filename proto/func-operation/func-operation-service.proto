  rpc GetFunctionPreviewBundle(func_operation_proto.GetFunctionPreviewBundleReq) returns (func_operation_proto.GetFunctionPreviewBundleResp);
  rpc InvokeFunctionPreview(func_operation_proto.InvokeFunctionPreviewReq) returns (func_operation_proto.InvokeFunctionPreviewResp);

