  rpc CreateFunction(func_operation_proto.CreateFunctionReq) returns (func_operation_proto.CreateFunctionResp);
  rpc UpdateFunction(func_operation_proto.UpdateFunctionReq) returns (func_operation_proto.UpdateFunctionResp);
  rpc LoadFunctionDocument(func_operation_proto.LoadFunctionDocumentReq) returns (func_operation_proto.LoadFunctionDocumentResp);
  rpc CommitFunctionDocument(func_operation_proto.CommitFunctionDocumentReq) returns (func_operation_proto.CommitFunctionDocumentResp);
  rpc MaterializeFunctionApp(func_operation_proto.MaterializeFunctionAppReq) returns (func_operation_proto.MaterializeFunctionAppResp);
  rpc LoadFunctionCodeState(func_operation_proto.LoadFunctionCodeStateReq) returns (func_operation_proto.LoadFunctionCodeStateResp);
  rpc TouchFunctionCodeDraft(func_operation_proto.TouchFunctionCodeDraftReq) returns (func_operation_proto.TouchFunctionCodeDraftResp);
  rpc ApplyFunctionCode(func_operation_proto.ApplyFunctionCodeReq) returns (func_operation_proto.ApplyFunctionCodeResp);
  rpc EnsureFunctionSession(func_operation_proto.EnsureFunctionSessionReq) returns (func_operation_proto.EnsureFunctionSessionResp);
  rpc DeleteFunction(func_operation_proto.DeleteFunctionReq) returns (func_operation_proto.DeleteFunctionResp);
  rpc ListFunctionDataForms(func_operation_proto.ListFunctionDataFormsReq) returns (func_operation_proto.ListFunctionDataFormsResp);
  rpc DeleteFunctionDataForm(func_operation_proto.DeleteFunctionDataFormReq) returns (func_operation_proto.DeleteFunctionDataFormResp);
