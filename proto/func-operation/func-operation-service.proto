  rpc DeleteExternalAPIClient(func_operation_proto.DeleteExternalAPIClientReq) returns (func_operation_proto.DeleteExternalAPIClientResp);
  rpc ListDeletedExternalAPIClients(func_operation_proto.ListDeletedExternalAPIClientsReq) returns (func_operation_proto.ListDeletedExternalAPIClientsResp);
  rpc PurgeExternalAPIClient(func_operation_proto.PurgeExternalAPIClientReq) returns (func_operation_proto.PurgeExternalAPIClientResp);
  rpc RotateExternalAPIImportKey(func_operation_proto.RotateExternalAPIImportKeyReq) returns (func_operation_proto.RotateExternalAPIImportKeyResp);
