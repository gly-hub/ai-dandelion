  rpc SetFunctionSkillEnabled(func_operation_proto.SetFunctionSkillEnabledReq) returns (func_operation_proto.SetFunctionSkillEnabledResp);
  rpc IssueFunctionSkillGrant(func_operation_proto.IssueFunctionSkillGrantReq) returns (func_operation_proto.IssueFunctionSkillGrantResp);
  rpc GetFunctionSkillTools(func_operation_proto.GetFunctionSkillToolsReq) returns (func_operation_proto.GetFunctionSkillToolsResp);
  rpc CreateFunctionSkillApproval(func_operation_proto.CreateFunctionSkillApprovalReq) returns (func_operation_proto.CreateFunctionSkillApprovalResp);
  rpc ExecuteFunctionSkill(func_operation_proto.ExecuteFunctionSkillReq) returns (func_operation_proto.ExecuteFunctionSkillResp);
  rpc ListFunctionSkillExecutions(func_operation_proto.ListFunctionSkillExecutionsReq) returns (func_operation_proto.ListFunctionSkillExecutionsResp);
  rpc ListOutboxEvents(func_operation_proto.ListOutboxEventsReq) returns (func_operation_proto.ListOutboxEventsResp);
