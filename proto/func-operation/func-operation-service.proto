  rpc CreateExternalAPI(func_operation_proto.CreateExternalAPIReq) returns (func_operation_proto.CreateExternalAPIResp);
  rpc UpdateExternalAPI(func_operation_proto.UpdateExternalAPIReq) returns (func_operation_proto.UpdateExternalAPIResp);
  rpc DeleteExternalAPI(func_operation_proto.DeleteExternalAPIReq) returns (func_operation_proto.DeleteExternalAPIResp);
  rpc ImportExternalAPIDocument(func_operation_proto.ImportExternalAPIDocumentReq) returns (func_operation_proto.ImportExternalAPIDocumentResp);
  rpc UploadExternalAPIDocument(func_operation_proto.UploadExternalAPIDocumentReq) returns (func_operation_proto.UploadExternalAPIDocumentResp);
  rpc TestExternalAPI(func_operation_proto.TestExternalAPIReq) returns (func_operation_proto.TestExternalAPIResp);

  rpc ListGeneratedApps(func_operation_proto.ListGeneratedAppsReq) returns (func_operation_proto.ListGeneratedAppsResp);
  rpc ReloadGeneratedApps(func_operation_proto.ReloadGeneratedAppsReq) returns (func_operation_proto.ReloadGeneratedAppsResp);
