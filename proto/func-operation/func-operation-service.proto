  rpc CreatePublicConfig(func_operation_proto.CreatePublicConfigReq) returns (func_operation_proto.CreatePublicConfigResp);
  rpc UpdatePublicConfig(func_operation_proto.UpdatePublicConfigReq) returns (func_operation_proto.UpdatePublicConfigResp);
  rpc ListPublicConfigVersions(func_operation_proto.ListPublicConfigVersionsReq) returns (func_operation_proto.ListPublicConfigVersionsResp);
  rpc RollbackPublicConfig(func_operation_proto.RollbackPublicConfigReq) returns (func_operation_proto.RollbackPublicConfigResp);
  rpc RotatePublicConfigImportKey(func_operation_proto.RotatePublicConfigImportKeyReq) returns (func_operation_proto.RotatePublicConfigImportKeyResp);
  rpc ImportPublicConfigs(func_operation_proto.ImportPublicConfigsReq) returns (func_operation_proto.ImportPublicConfigsResp);
  rpc ListExternalAPIClients(func_operation_proto.ListExternalAPIClientsReq) returns (func_operation_proto.ListExternalAPIClientsResp);
  rpc CreateExternalAPIClient(func_operation_proto.CreateExternalAPIClientReq) returns (func_operation_proto.CreateExternalAPIClientResp);
