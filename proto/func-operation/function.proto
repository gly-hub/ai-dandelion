  string menu_parent_id = 31 [(gogoproto.jsontag) = 'menuParentId'];
  string menu_id = 32 [(gogoproto.jsontag) = 'menuId'];
  string app_dir = 33 [(gogoproto.jsontag) = 'appDir'];
  string product_draft_doc_path = 34 [(gogoproto.jsontag) = 'productDraftDocPath'];
  string technical_draft_doc_path = 35 [(gogoproto.jsontag) = 'technicalDraftDocPath'];
  string active_release_id = 36 [(gogoproto.jsontag) = 'activeReleaseId'];
