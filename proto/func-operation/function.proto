  string next_action = 2 [(gogoproto.jsontag) = 'nextAction'];
  string blocking_reason = 3 [(gogoproto.jsontag) = 'blockingReason'];
  bool has_pending_product_draft = 4 [(gogoproto.jsontag) = 'hasPendingProductDraft'];
  bool has_pending_technical_draft = 5 [(gogoproto.jsontag) = 'hasPendingTechnicalDraft'];
  bool has_pending_code_draft = 6 [(gogoproto.jsontag) = 'hasPendingCodeDraft'];
}

