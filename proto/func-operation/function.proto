  string value_json = 5 [(gogoproto.jsontag) = 'valueJson'];
  int64 version = 6 [(gogoproto.jsontag) = 'version'];
  string updated_by = 7 [(gogoproto.jsontag) = 'updatedBy'];
  int64 created_at = 8 [(gogoproto.jsontag) = 'createdAt'];
  int64 updated_at = 9 [(gogoproto.jsontag) = 'updatedAt'];
}

