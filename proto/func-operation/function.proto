  string product_doc = 6 [(gogoproto.jsontag) = 'productDoc'];
  string technical_doc = 7 [(gogoproto.jsontag) = 'technicalDoc'];
  string product_doc_path = 8 [(gogoproto.jsontag) = 'productDocPath'];
  string technical_doc_path = 9 [(gogoproto.jsontag) = 'technicalDocPath'];
  string entry = 10 [(gogoproto.jsontag) = 'entry'];
  string product_session_id = 11 [(gogoproto.jsontag) = 'productSessionId'];
  string technical_session_id = 12 [(gogoproto.jsontag) = 'technicalSessionId'];
  string generation_session_id = 13 [(gogoproto.jsontag) = 'generationSessionId'];
  string generated_app_id = 14 [(gogoproto.jsontag) = 'generatedAppId'];
  int64 created_at = 15 [(gogoproto.jsontag) = 'createdAt'];
  int64 updated_at = 16 [(gogoproto.jsontag) = 'updatedAt'];
  int64 function_version = 17 [(gogoproto.jsontag) = 'functionVersion'];
  int64 product_doc_version = 18 [(gogoproto.jsontag) = 'productDocVersion'];
  int64 product_draft_version = 19 [(gogoproto.jsontag) = 'productDraftVersion'];
  int64 technical_doc_version = 20 [(gogoproto.jsontag) = 'technicalDocVersion'];
  int64 technical_draft_version = 21 [(gogoproto.jsontag) = 'technicalDraftVersion'];
  int64 code_version = 22 [(gogoproto.jsontag) = 'codeVersion'];
  bool product_draft_ready = 23 [(gogoproto.jsontag) = 'productDraftReady'];
  bool technical_draft_ready = 24 [(gogoproto.jsontag) = 'technicalDraftReady'];
  bool technical_stale = 25 [(gogoproto.jsontag) = 'technicalStale'];
  bool code_stale = 26 [(gogoproto.jsontag) = 'codeStale'];
  int64 code_draft_version = 27 [(gogoproto.jsontag) = 'codeDraftVersion'];
  bool code_draft_ready = 28 [(gogoproto.jsontag) = 'codeDraftReady'];
  int64 numeric_id = 29 [(gogoproto.jsontag) = 'numericId'];
