syntax = "proto3";

package system_proto;
option go_package = "./;system";
import "github.com/gogo/protobuf/gogoproto/gogo.proto";
import "github.com/team-dandelion/quickgo/grpcep/lib.proto";

message AgentModelThinkConfig {
  string mode = 1 [(gogoproto.jsontag) = 'mode'];
  int32 budget_tokens = 2 [(gogoproto.jsontag) = 'budgetTokens'];
  string display = 3 [(gogoproto.jsontag) = 'display'];
  int32 max_thinking_tokens = 4 [(gogoproto.jsontag) = 'maxThinkingTokens'];
}

message AgentModel {
  string id = 1 [(gogoproto.jsontag) = 'id'];
  string name = 2 [(gogoproto.jsontag) = 'name'];
  string model = 3 [(gogoproto.jsontag) = 'model'];
  string base_url = 4 [(gogoproto.jsontag) = 'baseUrl'];
  string auth_token = 5 [(gogoproto.jsontag) = 'authToken,omitempty'];
  AgentModelThinkConfig think_config = 6 [(gogoproto.jsontag) = 'thinkConfig,omitempty'];
  int32 status = 7 [(gogoproto.jsontag) = 'status'];
  bool is_default = 8 [(gogoproto.jsontag) = 'isDefault'];
  int32 sort = 9 [(gogoproto.jsontag) = 'sort'];
  string remark = 10 [(gogoproto.jsontag) = 'remark'];
  int64 created_at = 11 [(gogoproto.jsontag) = 'createdAt'];
  int64 updated_at = 12 [(gogoproto.jsontag) = 'updatedAt'];
}

message ListAgentModelsReq {
}

message ListAgentModelsResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  repeated AgentModel models = 2 [(gogoproto.jsontag) = 'models'];
}

message CreateAgentModelReq {
  string name = 1 [(gogoproto.jsontag) = 'name'];
  string model = 2 [(gogoproto.jsontag) = 'model'];
  string base_url = 3 [(gogoproto.jsontag) = 'baseUrl'];
  string auth_token = 4 [(gogoproto.jsontag) = 'authToken'];
  AgentModelThinkConfig think_config = 5 [(gogoproto.jsontag) = 'thinkConfig'];
  int32 status = 6 [(gogoproto.jsontag) = 'status'];
  bool is_default = 7 [(gogoproto.jsontag) = 'isDefault'];
  int32 sort = 8 [(gogoproto.jsontag) = 'sort'];
  string remark = 9 [(gogoproto.jsontag) = 'remark'];
}

message CreateAgentModelResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  AgentModel model = 2 [(gogoproto.jsontag) = 'model'];
}

message UpdateAgentModelReq {
  string id = 1 [(gogoproto.jsontag) = 'id'];
  string name = 2 [(gogoproto.jsontag) = 'name'];
  string model = 3 [(gogoproto.jsontag) = 'model'];
  string base_url = 4 [(gogoproto.jsontag) = 'baseUrl'];
  string auth_token = 5 [(gogoproto.jsontag) = 'authToken'];
  AgentModelThinkConfig think_config = 6 [(gogoproto.jsontag) = 'thinkConfig'];
  int32 status = 7 [(gogoproto.jsontag) = 'status'];
  bool is_default = 8 [(gogoproto.jsontag) = 'isDefault'];
  int32 sort = 9 [(gogoproto.jsontag) = 'sort'];
  string remark = 10 [(gogoproto.jsontag) = 'remark'];
}

message UpdateAgentModelResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  AgentModel model = 2 [(gogoproto.jsontag) = 'model'];
}

message DeleteAgentModelReq {
  string id = 1 [(gogoproto.jsontag) = 'id'];
}

message DeleteAgentModelResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
}

message EnableAgentModelReq {
  string id = 1 [(gogoproto.jsontag) = 'id'];
}

message EnableAgentModelResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  AgentModel model = 2 [(gogoproto.jsontag) = 'model'];
}

message DisableAgentModelReq {
  string id = 1 [(gogoproto.jsontag) = 'id'];
}

message DisableAgentModelResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  AgentModel model = 2 [(gogoproto.jsontag) = 'model'];
}
