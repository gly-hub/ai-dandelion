syntax = "proto3";

package system_proto;
option go_package = "./;system";
import "github.com/gogo/protobuf/gogoproto/gogo.proto";
import "github.com/gly-hub/quickgo/grpcep/lib.proto";

message Notification {
  string id = 1 [(gogoproto.jsontag) = 'id'];
  string title = 2 [(gogoproto.jsontag) = 'title'];
  string content = 3 [(gogoproto.jsontag) = 'content'];
  string display_type = 4 [(gogoproto.jsontag) = 'displayType'];
  string level = 5 [(gogoproto.jsontag) = 'level'];
  string target_user_id = 6 [(gogoproto.jsontag) = 'targetUserId'];
  string target_user_name = 7 [(gogoproto.jsontag) = 'targetUserName'];
  bool read = 8 [(gogoproto.jsontag) = 'read'];
  int64 created_at = 9 [(gogoproto.jsontag) = 'createdAt'];
}

message ListNotificationsReq {
  int32 page = 1 [(gogoproto.jsontag) = 'page'];
  int32 page_size = 2 [(gogoproto.jsontag) = 'pageSize'];
  bool unread_only = 3 [(gogoproto.jsontag) = 'unreadOnly'];
}

message ListNotificationsResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  repeated Notification notifications = 2 [(gogoproto.jsontag) = 'notifications'];
  int64 total = 3 [(gogoproto.jsontag) = 'total'];
  int64 unread_count = 4 [(gogoproto.jsontag) = 'unreadCount'];
}

message SendNotificationReq {
  string title = 1 [(gogoproto.jsontag) = 'title'];
  string content = 2 [(gogoproto.jsontag) = 'content'];
  string display_type = 3 [(gogoproto.jsontag) = 'displayType'];
  string level = 4 [(gogoproto.jsontag) = 'level'];
  repeated string user_ids = 5 [(gogoproto.jsontag) = 'userIds'];
}

message SendNotificationResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  Notification notification = 2 [(gogoproto.jsontag) = 'notification'];
}

message ReadNotificationReq {
  string id = 1 [(gogoproto.jsontag) = 'id'];
}

message ReadNotificationResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
}
