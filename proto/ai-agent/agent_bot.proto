syntax = "proto3";

package agent_bot_proto;
option go_package = "./;aiagent";
import "github.com/gogo/protobuf/gogoproto/gogo.proto";
import "github.com/gly-hub/quickgo/grpcep/lib.proto";

message AgentBotChannel {
  string id = 1 [(gogoproto.jsontag) = 'id'];
  string bot_id = 2 [(gogoproto.jsontag) = 'botId'];
  string channel = 3 [(gogoproto.jsontag) = 'channel'];
  string name = 4 [(gogoproto.jsontag) = 'name'];
  int32 status = 5 [(gogoproto.jsontag) = 'status'];
  string external_bot_id = 6 [(gogoproto.jsontag) = 'externalBotId'];
  string secret = 7 [(gogoproto.jsontag) = 'secret,omitempty'];
  string endpoint_url = 8 [(gogoproto.jsontag) = 'endpointUrl'];
  string config_json = 9 [(gogoproto.jsontag) = 'configJson'];
  int64 created_at = 10 [(gogoproto.jsontag) = 'createdAt'];
  int64 updated_at = 11 [(gogoproto.jsontag) = 'updatedAt'];
}

message AgentBotCapability {
  string id = 1 [(gogoproto.jsontag) = 'id'];
  string bot_id = 2 [(gogoproto.jsontag) = 'botId'];
  string capability_type = 3 [(gogoproto.jsontag) = 'capabilityType'];
  string capability_id = 4 [(gogoproto.jsontag) = 'capabilityId'];
  string name = 5 [(gogoproto.jsontag) = 'name'];
  int32 enabled = 6 [(gogoproto.jsontag) = 'enabled'];
  int64 created_at = 7 [(gogoproto.jsontag) = 'createdAt'];
  int64 updated_at = 8 [(gogoproto.jsontag) = 'updatedAt'];
}

message AgentBot {
  string id = 1 [(gogoproto.jsontag) = 'id'];
  string name = 2 [(gogoproto.jsontag) = 'name'];
  string code = 3 [(gogoproto.jsontag) = 'code'];
  int32 status = 4 [(gogoproto.jsontag) = 'status'];
  string description = 5 [(gogoproto.jsontag) = 'description'];
  string business_scene = 6 [(gogoproto.jsontag) = 'businessScene'];
  string welcome_message = 7 [(gogoproto.jsontag) = 'welcomeMessage'];
  string model_id = 8 [(gogoproto.jsontag) = 'modelId'];
  string system_prompt = 9 [(gogoproto.jsontag) = 'systemPrompt'];
  string permission_mode = 10 [(gogoproto.jsontag) = 'permissionMode'];
  int32 max_turns = 11 [(gogoproto.jsontag) = 'maxTurns'];
  int64 created_at = 12 [(gogoproto.jsontag) = 'createdAt'];
  int64 updated_at = 13 [(gogoproto.jsontag) = 'updatedAt'];
  repeated AgentBotChannel channels = 14 [(gogoproto.jsontag) = 'channels'];
  repeated AgentBotCapability capabilities = 15 [(gogoproto.jsontag) = 'capabilities'];
}

message ListAgentBotsReq {
}

message ListAgentBotsResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  repeated AgentBot bots = 2 [(gogoproto.jsontag) = 'bots'];
}

message ListAgentBotRuntimeConfigsReq {
}

message ListAgentBotRuntimeConfigsResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  repeated AgentBot bots = 2 [(gogoproto.jsontag) = 'bots'];
}

message CreateAgentBotReq {
  string name = 1 [(gogoproto.jsontag) = 'name'];
  string code = 2 [(gogoproto.jsontag) = 'code'];
  int32 status = 3 [(gogoproto.jsontag) = 'status'];
  string description = 4 [(gogoproto.jsontag) = 'description'];
  string business_scene = 5 [(gogoproto.jsontag) = 'businessScene'];
  string welcome_message = 6 [(gogoproto.jsontag) = 'welcomeMessage'];
  string model_id = 7 [(gogoproto.jsontag) = 'modelId'];
  string system_prompt = 8 [(gogoproto.jsontag) = 'systemPrompt'];
  string permission_mode = 9 [(gogoproto.jsontag) = 'permissionMode'];
  int32 max_turns = 10 [(gogoproto.jsontag) = 'maxTurns'];
  repeated AgentBotChannel channels = 11 [(gogoproto.jsontag) = 'channels'];
  repeated AgentBotCapability capabilities = 12 [(gogoproto.jsontag) = 'capabilities'];
}

message CreateAgentBotResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  AgentBot bot = 2 [(gogoproto.jsontag) = 'bot'];
}

message UpdateAgentBotReq {
  string id = 1 [(gogoproto.jsontag) = 'id'];
  string name = 2 [(gogoproto.jsontag) = 'name'];
  string code = 3 [(gogoproto.jsontag) = 'code'];
  int32 status = 4 [(gogoproto.jsontag) = 'status'];
  string description = 5 [(gogoproto.jsontag) = 'description'];
  string business_scene = 6 [(gogoproto.jsontag) = 'businessScene'];
  string welcome_message = 7 [(gogoproto.jsontag) = 'welcomeMessage'];
  string model_id = 8 [(gogoproto.jsontag) = 'modelId'];
  string system_prompt = 9 [(gogoproto.jsontag) = 'systemPrompt'];
  string permission_mode = 10 [(gogoproto.jsontag) = 'permissionMode'];
  int32 max_turns = 11 [(gogoproto.jsontag) = 'maxTurns'];
  repeated AgentBotChannel channels = 12 [(gogoproto.jsontag) = 'channels'];
  repeated AgentBotCapability capabilities = 13 [(gogoproto.jsontag) = 'capabilities'];
}

message UpdateAgentBotResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  AgentBot bot = 2 [(gogoproto.jsontag) = 'bot'];
}

message DeleteAgentBotReq {
  string id = 1 [(gogoproto.jsontag) = 'id'];
}

message DeleteAgentBotResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
}

message EnableAgentBotReq {
  string id = 1 [(gogoproto.jsontag) = 'id'];
}

message EnableAgentBotResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  AgentBot bot = 2 [(gogoproto.jsontag) = 'bot'];
}

message DisableAgentBotReq {
  string id = 1 [(gogoproto.jsontag) = 'id'];
}

message DisableAgentBotResp {
  grpcep.CommonResp common_resp = 1 [(gogoproto.jsontag) = 'common_resp'];
  AgentBot bot = 2 [(gogoproto.jsontag) = 'bot'];
}
