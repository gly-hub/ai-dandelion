app:
  name: "system"
  version: "1.0.0"
  env: "local"

logger:
  enabled: true
  level: "info"
  output: "console"
  service: "system"
  version: "1.0.0"

grpcServer:
  serviceName: "system"
  address: "0.0.0.0"
  port: 50053
  keepAliveTime: "10s"
  keepAliveTimeout: "3s"
  etcd:
    endpoints:
      - "127.0.0.1:2379"
    dialTimeout: "5s"
    prefix: "/grpc/services"
    ttl: 30

gorm:
  databases:
    - name: "ai-dandelion"
      master:
        type: "sqlite"
        database: "data/ai-dandelion.db?_journal_mode=WAL&_busy_timeout=5000&_foreign_keys=on"
      maxIdleConn: 1
      maxOpenConn: 1
      connMaxLifetime: "30m"
      connMaxIdleTime: "10m"
      enableLog: false
      logLevel: "warn"
      slowThreshold: 200

redis:
  databases:
    - name: "ai-dandelion"
      host: "127.0.0.1"
      port: 6379
      password: ""
      db: 1
      poolSize: 10
      minIdleConns: 5
      maxConnAge: "1h"
      poolTimeout: "4s"
      idleTimeout: "5m"
      dialTimeout: "5s"
      readTimeout: "3s"
      writeTimeout: "3s"

auth:
  # Must exactly match inner-gateway.auth.token_secret.
  token_secret: "REPLACE_WITH_THE_SAME_RANDOM_JWT_SIGNING_SECRET"
  token_ttl: "24h"

uploader:
  # Leave address or bucket empty to disable object uploads locally.
  address: ""
  accessKeyId: ""
  secretAccessKey: ""
  secure: true
  bucket: ""
  basePath: "uploads"
  location: "us-east-1"
  domain: ""

tracing:
  enabled: false
  serviceName: "system"
  serviceVersion: "1.0.0"
  environment: "local"
  samplingRate: 0.1
  otlp:
    enabled: false
    endpoint: "http://127.0.0.1:4318"
    useGRPC: false
    insecure: true
