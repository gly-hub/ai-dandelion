app:
  name: "ai-agent"
  version: "1.0.0"
  env: "local"

logger:
  enabled: true
  level: "info"
  output: "console"
  service: "ai-agent"
  version: "1.0.0"

grpcServer:
  serviceName: "ai-agent"
  address: "0.0.0.0"
  port: 50051
  keepAliveTime: "10s"
  keepAliveTimeout: "3s"
  etcd:
    endpoints:
      - "127.0.0.1:2379"
    dialTimeout: "5s"
    prefix: "/grpc/services"
    ttl: 30

grpcClient:
  timeout: "10s"
  insecure: true
  keepAliveTime: "5m"
  keepAliveTimeout: "10s"
  loadBalancing: "round_robin"
  etcd:
    endpoints:
      - "127.0.0.1:2379"
    dialTimeout: "5s"
    prefix: "/grpc/services"

gorm:
  databases:
    - name: "ai-dandelion"
      master:
        type: "sqlite"
        database: "data/ai-dandelion.db?_journal_mode=WAL&_busy_timeout=5000&_foreign_keys=on"
      maxIdleConn: 1
      maxOpenConn: 1
      connMaxLifetime: "30m"
      connMaxIdleTime: "10m"
      enableLog: false
      logLevel: "warn"
      slowThreshold: 200

redis:
  databases:
    - name: "ai-dandelion"
      host: "127.0.0.1"
      port: 6379
      password: ""
      db: 0
      poolSize: 10
      minIdleConns: 5
      maxConnAge: "1h"
      poolTimeout: "4s"
      idleTimeout: "5m"
      dialTimeout: "5s"
      readTimeout: "3s"
      writeTimeout: "3s"

tracing:
  enabled: false
  serviceName: "ai-agent"
  serviceVersion: "1.0.0"
  environment: "local"
  samplingRate: 0.1
  otlp:
    enabled: false
    endpoint: "http://127.0.0.1:4318"
    useGRPC: false
    insecure: true

agent:
  # Set this to the absolute repository path when the agent needs workspace access.
  cwd: "/path/to/ai-dandelion"
  system_prompt: "You are a helpful agent assistant. Keep answers clear and practical."
  model: "your-model-name"
  cli_path: ""
  # Do not use bypassPermissions outside an isolated development sandbox.
  permission_mode: "default"
  max_turns: 20
  # Prefer ANTHROPIC_AUTH_TOKEN in the service environment; never place it here.
  auth_token: ""
  base_url: "https://api.example.com/anthropic"
  think_config:
    mode: "adaptive"
    budget_tokens: 4096
    display: "summarized"
    max_thinking_tokens: 0
  skill_storage_dir: "data/user-skills"
  function_skill_mcp_url: "http://127.0.0.1:8086/mcp/function-skills"
