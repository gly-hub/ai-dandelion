app:
  name: "ai-agent"
  version: "1.0.0"
  env: "local"

logger:
  enabled: true
  level: "info"
  output: "console"
  service: "ai-agent"
  version: "1.0.0"

grpcServer:
  serviceName: "ai-agent"
  address: "0.0.0.0"
  port: 50051
  keepAliveTime: "10s"
  keepAliveTimeout: "3s"
  etcd:
    endpoints:
      - "127.0.0.1:2379"
    dialTimeout: "5s"
    prefix: "/grpc/services"
    ttl: 30

grpcClient:
  timeout: "10s"
  insecure: true
  keepAliveTime: "5m"
  keepAliveTimeout: "10s"
  loadBalancing: "round_robin"
  etcd:
    endpoints:
      - "127.0.0.1:2379"
    dialTimeout: "5s"
    prefix: "/grpc/services"

gorm:
  databases:
    - name: "ai-dandelion"
      master:
        type: "sqlite"
        database: "data/ai-dandelion.db?_journal_mode=WAL&_busy_timeout=5000&_foreign_keys=on"
      maxIdleConn: 1
      maxOpenConn: 1
      connMaxLifetime: "30m"
      connMaxIdleTime: "10m"
      enableLog: false
      logLevel: "warn"
      slowThreshold: 200

redis:
  databases:
    - name: "ai-dandelion"
      host: "127.0.0.1"
      port: 6379
      password: ""
      db: 0
      poolSize: 10
      minIdleConns: 5
      maxConnAge: "1h"
      poolTimeout: "4s"
      idleTimeout: "5m"
      dialTimeout: "5s"
      readTimeout: "3s"
      writeTimeout: "3s"

tracing:
  enabled: false
  serviceName: "ai-agent"
  serviceVersion: "1.0.0"
  environment: "local"
  samplingRate: 0.1
  otlp:
    enabled: false
    endpoint: "http://127.0.0.1:4318"
    useGRPC: false
    insecure: true

agent:
  # Set this to the absolute repository path when the agent needs workspace access.
  cwd: "/path/to/ai-dandelion"
  system_prompt: "你是平台通用 AI Agent。请准确理解用户意图，优先使用已配置的工具和数据完成任务；不确定时明确说明并提出必要澄清，不要编造事实、接口、权限或执行结果。涉及功能搭建时，严格遵守当前会话阶段的产品、技术或实现提示词，不跨阶段代替用户做未确认的决策。只有实际完成并验证了操作，才能声称完成。回答清晰、简洁、可执行。"
  model: "your-model-name"
  cli_path: ""
  # Do not use bypassPermissions outside an isolated development sandbox.
  permission_mode: "default"
  max_turns: 20
  # Prefer ANTHROPIC_AUTH_TOKEN in the service environment; never place it here.
  auth_token: ""
  base_url: "https://api.example.com/anthropic"
  think_config:
    mode: "adaptive"
    budget_tokens: 4096
    display: "summarized"
    max_thinking_tokens: 0
  skill_storage_dir: "data/user-skills"
  # Session-scoped copies of validated chat attachments for the Agent to read.
  attachment_storage_dir: "data/agent-attachments"
